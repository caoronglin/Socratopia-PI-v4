name: One-time merged branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/branch-cleanup-once.yml"

permissions:
  contents: write

jobs:
  prune-merged-branches:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete only merged, unprotected, fully integrated branches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_MAIN: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          expected_main = os.environ["EXPECTED_MAIN"]
          root = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "socratopia-one-time-cleanup",
          }

          def api(path, method="GET"):
              req = urllib.request.Request(root + path, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  if method == "DELETE":
                      return None
                  return json.load(response)

          def items(path):
              acc = []
              page = 1
              while True:
                  separator = "&" if "?" in path else "?"
                  batch = api(f"{path}{separator}per_page=100&page={page}")
                  acc.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
                  if page > 10:
                      raise RuntimeError("Refusing to act on more than 1000 entries")
              return acc

          def contained(older_sha):
              cmp = api(f"/compare/{older_sha}...main")
              return cmp.get("status") in ("identical", "ahead") and cmp.get("behind_by") == 0

          repo_info = api("")
          if repo_info.get("default_branch") != "main":
              raise RuntimeError("Default branch changed: abort cleanup")
          main = api("/branches/main")
          if main["commit"]["sha"] != expected_main or main["protected"]:
              raise RuntimeError("main moved or protection changed: abort cleanup")

          branches = items("/branches")
          open_prs = items("/pulls?state=open")
          merged = [p for p in items("/pulls?state=closed") if p.get("merged_at")]
          active_heads = {p["head"]["ref"] for p in open_prs}
          protected = {"main", "single-skills"}
          to_delete = []
          preserved = []
          for branch in branches:
              name = branch["name"]
              sha = branch["commit"]["sha"]
              if name in protected or branch["protected"] or name in active_heads:
                  preserved.append((name, "protected/default/unmerged"))
                  continue
              if name == "claude-code":
                  if not contained(sha):
                      preserved.append((name, "not included in main"))
                      continue
                  to_delete.append((name, sha))
                  continue
              proof = [
                  p for p in merged
                  if p["head"]["ref"] == name
                  and p["head"]["sha"] == sha
                  and p["base"]["ref"] in ("claude-code", "main")
              ]
              if not proof or not any(
                  p.get("merge_commit_sha") and contained(p["merge_commit_sha"])
                  for p in proof
              ):
                  preserved.append((name, "no verified merged PR head in main"))
                  continue
              to_delete.append((name, sha))

          print("Verified deletion candidates:", len(to_delete))
          print("Preserved branches:", preserved)
          if len(to_delete) != 18:
              raise RuntimeError(
                  f"Expected 18 integrated branches, got {len(to_delete)}; refusing partial cleanup"
              )
          for name, sha in sorted(to_delete, key=lambda item: item[0] == "claude-code"):
              current = api("/branches/" + urllib.parse.quote(name, safe="/"))
              if current["commit"]["sha"] != sha or current["protected"]:
                  raise RuntimeError(f"Branch changed; stop before deleting {name}")
              ref = urllib.parse.quote("heads/" + name, safe="/")
              api("/git/refs/" + ref, method="DELETE")
              print("Deleted integrated branch:", name)
          print("One-time branch cleanup complete.")
          PY
