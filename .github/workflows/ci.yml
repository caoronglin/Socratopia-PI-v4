name: ci

on:
  push:
    branches: [main, claude-code]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel older runs on the same branch / pull request instead of wasting
# runners while a series of quick commits is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }} / doctor and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout (pinned v4)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python (pinned v5)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned test runner
        run: python -m pip install -r requirements-ci.txt
      - name: Verify installed requirements
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Cherry Pi workspace smoke check (offline)
        run: python scripts/cherry_preflight.py
      - name: Doctor and complete regression suite
        run: python scripts/check.py --strict

  rust-cli:
    name: Rust CLI / fmt, clippy, tests, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install minimal pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - name: Check Rust formatting
        run: cargo +1.85.1 fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Check Rust Clippy warnings
        run: cargo +1.85.1 clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
      - name: Run Rust unit tests
        run: cargo +1.85.1 test --manifest-path rust/Cargo.toml --locked
      - name: Compile CLI binary
        run: cargo +1.85.1 build --manifest-path rust/Cargo.toml --release --locked
      - name: Validate read-only CLI entrypoint
        run: |
          rust/target/release/socratopia --version
          rust/target/release/socratopia status --course "遗传学"
          rust/target/release/socratopia preflight
          rust/target/release/socratopia init plan --course "遗传学"
