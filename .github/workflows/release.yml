name: Release ZIP

on:
  push:
    branches: [claude-code]
    paths:
      - "release/VERSION"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/claude-code'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install verified testing dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Strict full validation before publishing
        run: python scripts/check.py --strict
      - name: Build and verify manifest-allowlisted ZIP
        run: |
          python scripts/package_release.py --output-dir dist
          cd dist
          sha256sum -c *.sha256
      - name: Publish immutable prerelease with ZIP and SHA-256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(tr -d '\r\n' < release/VERSION)"
          test -n "$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing overwrite"
            exit 1
          fi
          gh release create "$TAG" dist/*.zip dist/*.sha256 \
            --target "$GITHUB_SHA" \
            --title "Socratopia PI $TAG" \
            --notes-file release/NOTES.md \
            --prerelease
          gh release view "$TAG" --json url,assets --jq '{url:.url, assets:[.assets[].name]}'
