name: Release ZIP + Native Rust CLI

on:
  push:
    branches: [claude-code]
    paths: ["release/VERSION"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/claude-code'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Strict doctor and full Python test suite
        run: python scripts/check.py --strict
      - name: Rust unit tests before platform packaging
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 test --manifest-path rust/Cargo.toml --locked

  build:
    needs: verify
    name: Package ${{ matrix.platform }} CLI
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            binary: rust/target/release/socratopia
          - runner: windows-2022
            platform: windows-x86_64
            binary: rust/target/release/socratopia.exe
          - runner: macos-15-intel
            platform: macos-x86_64
            binary: rust/target/release/socratopia
          - runner: macos-15
            platform: macos-arm64
            binary: rust/target/release/socratopia
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Build native Rust CLI
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --release --locked --manifest-path rust/Cargo.toml
      - name: Package platform ZIP and smoke-test extracted binary
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          CLI_BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          python scripts/package_release.py --platform "$PLATFORM" --cli-binary "$CLI_BINARY" --output-dir dist
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import stat
          import subprocess
          import zipfile

          platform = os.environ["PLATFORM"]
          version = pathlib.Path("release/VERSION").read_text(encoding="utf-8").strip()
          name = f"Socratopia-PI-v4-{version}-{platform}.zip"
          archive = pathlib.Path("dist") / name
          expected_hash = (pathlib.Path("dist") / (name + ".sha256")).read_text().split()[0]
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected_hash
          folder = f"Socratopia-PI-v4-{version}"
          binary_name = "socratopia.exe" if platform.startswith("windows") else "socratopia"
          bin_entry = f"{folder}/bin/{binary_name}"
          with zipfile.ZipFile(archive) as package:
              names = package.namelist()
              assert bin_entry in names, "native executable missing from archive"
              assert f"{folder}/AGENTS.md" in names
              assert f"{folder}/scripts/initialize.py" in names
              assert not any("/DATA/" in n or "/TEXTBOOK/" in n for n in names)
              assert package.getinfo(bin_entry).external_attr >> 16 & 0o111
              package.extractall("smoke")
          binary = pathlib.Path("smoke") / bin_entry
          if os.name != "nt":
              binary.chmod(binary.stat().st_mode | stat.S_IXUSR)
          for arguments in (["--version"], ["status", "--course", "遗传学"], ["preflight"]):
              subprocess.run([str(binary.resolve()), *arguments],
                             cwd=binary.parent.parent, check=True)
          print(f"Verified native CLI: {archive} / SHA-256 {expected_hash}")
          PY
      - name: Upload platform bundle (ZIP + SHA-256)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bundle-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download all verified platform bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist
      - name: Verify all eight immutable release assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 4
          test "$(find dist -maxdepth 1 -type f -name '*.sha256' | wc -l)" -eq 4
          cd dist
          sha256sum --check *.sha256
      - name: Publish verified CLI bundles
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$(tr -d '\r\n' < release/VERSION)"
          test -n "$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG exists; refusing to overwrite immutable assets"
            exit 1
          fi
          gh release create "$TAG" dist/*.zip dist/*.sha256 \
            --target "$GITHUB_SHA" \
            --title "Socratopia PI $TAG (native Rust CLI bundles)" \
            --notes-file release/NOTES.md \
            --prerelease
          gh release view "$TAG" --json url,assets --jq '{url:.url, assets:[.assets[].name]}'
